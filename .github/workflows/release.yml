name: Build and release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: ./build.ps1 -OutputDirectory ./dist
      - name: Test
        shell: powershell
        run: ./scripts/test.ps1
      - name: Install compiler
        shell: powershell
        run: |
          $candidates=@('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 7\ISCC.exe')
          $compiler=$candidates | Where-Object {Test-Path -LiteralPath $_} | Select-Object -First 1
          if(!$compiler){choco install innosetup --yes --no-progress; $compiler=$candidates | Where-Object {Test-Path -LiteralPath $_} | Select-Object -First 1}
          if(!$compiler){throw 'Inno Setup compiler missing'}
          "INNO_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Package
        shell: powershell
        run: ./scripts/package.ps1 -CompilerPath $env:INNO_COMPILER
      - name: Test installer
        shell: powershell
        run: |
          $setup=Get-ChildItem ./artifacts/CaptureStudio-Setup-*.exe | Select-Object -First 1
          $target=Join-Path $env:RUNNER_TEMP 'capture-studio-installed'
          $data=Join-Path $env:LOCALAPPDATA 'CaptureStudio'
          New-Item -ItemType Directory -Path $data -Force | Out-Null
          $sentinel=Join-Path $data 'installer-preservation-test.txt'
          Set-Content -LiteralPath $sentinel -Value 'keep this user data'
          $result=Start-Process -FilePath $setup.FullName -ArgumentList @('/VERYSILENT','/SP-','/NORESTART',('/DIR="'+$target+'"')) -PassThru -Wait
          if($result.ExitCode -ne 0){throw "Installer exit $($result.ExitCode)"}
          if(!(Test-Path -LiteralPath (Join-Path $target 'CaptureStudio.exe'))){throw 'Executable not installed'}
          if((Get-Content -LiteralPath $sentinel) -ne 'keep this user data'){throw 'User data changed'}
          Set-Content -LiteralPath (Join-Path $data 'preferences.json') -Value '{"CheckUpdates":false,"CloseToTray":true}'
          $app=Start-Process -FilePath (Join-Path $target 'CaptureStudio.exe') -ArgumentList '--background' -PassThru
          Start-Sleep -Seconds 3
          if($app.HasExited){throw 'Application did not start for shutdown test'}
          $result=Start-Process -FilePath $setup.FullName -ArgumentList @('/VERYSILENT','/SP-','/NORESTART',('/DIR="'+$target+'"')) -PassThru -Wait
          if($result.ExitCode -ne 0){throw 'Reinstallation failed'}
          if(!$app.WaitForExit(10000)){throw 'Installer did not close the application gracefully'}
          $result=Start-Process -FilePath (Join-Path $target 'unins000.exe') -ArgumentList @('/VERYSILENT','/NORESTART') -PassThru -Wait
          if($result.ExitCode -ne 0){throw 'Uninstall failed'}
          if(Test-Path -LiteralPath (Join-Path $target 'CaptureStudio.exe')){throw 'Executable not removed'}
          if((Get-Content -LiteralPath $sentinel) -ne 'keep this user data'){throw 'Uninstall changed user data'}
      - uses: actions/upload-artifact@v4
        with:
          name: capture-studio-release
          path: artifacts/*
      - name: Publish
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version=[regex]::Match((Get-Content ./VersionInfo.cs -Raw),'ReleaseVersion="([0-9.]+)"').Groups[1].Value
          gh release create "v$version" ./artifacts/* --target $env:GITHUB_SHA --title "Capture Studio $version" --notes-file ./RELEASE_NOTES.md
          if($LASTEXITCODE -ne 0){throw 'Release publication failed'}

